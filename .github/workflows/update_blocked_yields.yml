name: Update blocked yield cache

on:
  schedule:
    - cron: "13 0,6,12,18 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "data_sources.py"
      - "config.py"
      - "scripts/fetch_blocked_yields.py"
      - ".github/workflows/update_blocked_yields.yml"

permissions:
  contents: write

concurrency:
  group: update-blocked-yields
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet pandas numpy requests openpyxl

      - name: Fetch CH / NZ yields from a non-blocked network
        run: python scripts/fetch_blocked_yields.py

      - name: Commit cache if changed
        run: |
          if git diff --quiet -- cache/blocked_yields.json; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add cache/blocked_yields.json
            git commit -m "chore: update cached CH/NZ yields"
            git push
          fi
